<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Portal — Book Mera Plot (bookmeraplot.com)</title>
  <meta name="description" content="Sign in to Book Mera Plot Company Admin & Member Investor Portal">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/images/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <link rel="stylesheet" href="/css/style.css?v=3.5">
  <script src="js/theme.js?v=3.5"></script>
</head>
<body class="login-page">
  <div class="login-bg-orb orb1"></div>
  <div class="login-bg-orb orb2"></div>
  <a href="/" class="back-link">← Back to Website</a>

  <div class="login-card">
    <div class="login-logo">
      <img src="/images/logo.png" alt="Book Mera Plot" style="width:68px;height:68px;object-fit:contain;border-radius:14px;background:#FFFFFF;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,0.12)">
      <div>
        <h1 id="login-title">Book Mera Plot</h1>
        <p id="login-subtitle-role">Company / Member Login</p>
      </div>
    </div>

    <!-- Unified Role Tabs -->
    <div class="role-tabs">
      <button class="role-tab active" id="tab-company" onclick="setRole('company')">🏢 Company</button>
      <button class="role-tab" id="tab-member" onclick="setRole('member')">👤 Member</button>
    </div>

    <p class="login-subtitle">Enter your credentials to access your dashboard</p>

    <div id="login-alert" style="display:none"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="login-id" style="font-size:12px;letter-spacing:0.04em;text-transform:uppercase;font-weight:700">Member ID or Email</label>
        <input type="text" id="login-id" class="form-control" placeholder="e.g. BAP0001 or admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password" style="font-size:12px;letter-spacing:0.04em;text-transform:uppercase;font-weight:700">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      
      <!-- T&C Checkbox (only for member login) -->
      <div id="tnc-section" style="display:none;margin:16px 0;padding:12px;background:rgba(0,188,212,0.05);border:1px solid rgba(0,188,212,0.2);border-radius:8px">
        <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:11px;color:var(--text-secondary);line-height:1.4">
          <input type="checkbox" id="tnc-checkbox" style="margin-top:2px;min-width:16px;min-height:16px">
          <div>
            <strong style="color:var(--text-primary);display:block;margin-bottom:4px">I accept the Terms & Conditions</strong>
            <details style="cursor:pointer">
              <summary style="color:var(--gold);font-weight:600;margin-bottom:8px">Read Terms & Conditions (English / हिंदी)</summary>
              <div style="background:var(--white);padding:12px;border-radius:6px;margin-top:8px;font-size:10px;color:var(--text-secondary);max-height:200px;overflow-y:auto">
                <strong style="color:var(--text-primary);display:block;margin-bottom:8px">English:</strong>
                <p style="margin:4px 0">I have read and fully understood the Book Mera Plot business plan. I understand all the Terms & Conditions of this plan. I understand the income structure of this plan. I understand the risks involved in this plan. I understand my responsibilities under this plan. I am joining this plan out of my own free will. No one has pressured or misled me into joining. I am joining with full awareness and understanding. I am starting this business for my own personal growth. I am signing/agreeing to this with full consideration and understanding.</p>
                <strong style="color:var(--text-primary);display:block;margin-bottom:8px;margin-top:12px">हिंदी:</strong>
                <p style="margin:4px 0">मैंने Book Mera Plot की बिज़नेस प्लान को पढ़ और पूरी तरह समझ लिया है। मुझे इस योजना के सभी नियम व शर्तें (Terms & Conditions) समझ आ गए हैं। मुझे इस योजना की आय संरचना (income structure) समझ आ गई है। मुझे इस योजना से जुड़े जोखिम (risks) समझ आ गए हैं। मुझे इस योजना के अंतर्गत मेरी जिम्मेदारियाँ (responsibilities) समझ आ गई हैं। मैं अपनी स्वतंत्र इच्छा से इस योजना से जुड़ रहा/रही हूँ। मुझ पर किसी भी प्रकार का दबाव नहीं डाला गया और न ही मुझे गुमराह किया गया है। मैं पूरी जागरूकता और समझ के साथ इससे जुड़ रहा/रही हूँ। मैं अपनी व्यक्तिगत वृद्धि (growth) के लिए यह व्यवसाय शुरू कर रहा/रही हूँ। मैं पूर्ण विचार और समझ के साथ इस पर हस्ताक्षर/सहमति दे रहा/रही हूँ।</p>
              </div>
            </details>
          </div>
        </label>
      </div>
      
      <button type="submit" class="btn btn-gold" id="login-btn" style="width:100%;padding:13px;font-size:15px;font-weight:700">
        <span id="login-btn-text">Sign In</span>
        <span id="login-spinner" class="spinner" style="display:none;width:16px;height:16px"></span>
      </button>
    </form>

    <div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border);text-align:center">
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Contact your company admin for login credentials.</p>
      <div style="display:flex;justify-content:center;gap:16px;font-size:13px">
        <a href="/cms-admin.html" style="color:var(--gold);font-weight:600;text-decoration:none">⚙️ Website CMS Admin Login →</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    let currentRole = 'member';

    function setRole(role) {
      currentRole = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      const tab = document.getElementById('tab-' + role);
      if (tab) tab.classList.add('active');
      const subtitles = { company: 'Company Admin Login', member: 'Member / Investor Login' };
      const subEl = document.getElementById('login-subtitle-role');
      if (subEl) subEl.textContent = subtitles[role] || 'Member / Investor Login';
      
      const input = document.getElementById('login-id');
      if (input) {
        input.placeholder = role === 'company' ? 'e.g. admin or company ID' : 'e.g. BAP0001 or member ID';
      }
      
      // Show/hide T&C section based on role
      const tncSection = document.getElementById('tnc-section');
      const tncCheckbox = document.getElementById('tnc-checkbox');
      if (tncSection && tncCheckbox) {
        if (role === 'member') {
          tncSection.style.display = 'block';
        } else {
          tncSection.style.display = 'none';
          tncCheckbox.checked = false;
        }
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('role') === 'company') {
      setRole('company');
    } else {
      setRole('member');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const alertEl = document.getElementById('login-alert');
      btn.disabled = true;
      document.getElementById('login-btn-text').style.display = 'none';
      document.getElementById('login-spinner').style.display = 'inline-block';
      alertEl.style.display = 'none';

      // Validate T&C checkbox for member login
      if (currentRole === 'member' && !document.getElementById('tnc-checkbox').checked) {
        alertEl.innerHTML = `<div class="alert alert-error">⚠️ You must accept the Terms & Conditions before logging in as a member.</div>`;
        alertEl.style.display = 'block';
        btn.disabled = false;
        document.getElementById('login-btn-text').style.display = 'inline';
        document.getElementById('login-spinner').style.display = 'none';
        return;
      }

      try {
        const requestBody = {
          login: document.getElementById('login-id').value.trim(),
          password: document.getElementById('password').value
        };

        // Add T&C acceptance for member login
        if (currentRole === 'member') {
          requestBody.tnc_accepted = document.getElementById('tnc-checkbox').checked;
        }

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });
        const data = await res.json();

        if (!res.ok) {
          alertEl.innerHTML = `<div class="alert alert-error">⚠️ ${data.error}</div>`;
          alertEl.style.display = 'block';
          
          // Show T&C required error specifically and auto-reveal T&C
          if (data.requires_tnc) {
            setRole('member');
            alertEl.innerHTML = `<div class="alert alert-error">⚠️ Please review and accept the Terms & Conditions below to proceed.</div>`;
            alertEl.style.display = 'block';
            document.getElementById('tnc-section')?.scrollIntoView({ behavior: 'smooth' });
          }
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        if (data.user.role === 'admin') {
          window.location.href = '/company-dashboard.html';
        } else {
          window.location.href = '/user-dashboard.html';
        }
      } catch {
        alertEl.innerHTML = `<div class="alert alert-error">⚠️ Connection failed. Make sure the server is running.</div>`;
        alertEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        document.getElementById('login-btn-text').style.display = 'inline';
        document.getElementById('login-spinner').style.display = 'none';
      }
    });

    // Redirect if already logged in
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (token && user) {
      window.location.href = user.role === 'admin' ? '/company-dashboard.html' : '/user-dashboard.html';
    }
  </script>
</body>
</html>
